[project]
name = "localsandbox"
version = "0.3.2"
description = "A Python SDK for an AgentFS + just-bash agent sandbox."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11.0",
]

[project.optional-dependencies]
monty = [
    "pydantic-monty>=0.0.21",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = ["localsandbox"]
source-include = ["localsandbox/shim/**"]
source-exclude = ["localsandbox/shim/node_modules/**", "localsandbox/shim/experiments/**"]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pydantic-monty>=0.0.21",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
