[project]
name = "localsandbox"
version = "0.3.2"
description = "A python SDK for a agentfs + just-bash + pyodide agent sandbox."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11.0",
]

[build-system]
requires = ["uv_build>=0.8.19,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = ["localsandbox"]
source-include = ["localsandbox/shim/**"]
source-exclude = ["localsandbox/shim/node_modules/**", "localsandbox/shim/experiments/**"]

[dependency-groups]
dev = [
    "pillow>=11.0.0",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.14.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
